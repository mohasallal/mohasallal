<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="184" viewBox="0 0 620 184" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Alsallal GitHub statistics</title>
  <desc id="desc">Self-generated GitHub profile graphic for Mohammad Alsallal.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d20" />
      <stop offset="100%" stop-color="#0b0712" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }
      .title { fill: #f5f3ff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #a89bbd; font-size: 11px; letter-spacing: 1px; }
      .value { fill: #f5f3ff; font-size: 25px; font-weight: 700; }
      .small { fill: #a89bbd; font-size: 10px; }
    </style>
  </defs>
  
      
  <rect x="1" y="1" width="618" height="182" rx="16" fill="url(#panel)" stroke="#352451" />
  <rect x="20" y="0" width="96" height="2" rx="1" fill="url(#accent)" filter="url(#glow)" />

      <text x="26" y="36" class="title">THE LAST 365 DAYS</text>
      <text x="594" y="35" text-anchor="end" class="label">@mohasallal</text>
      
  <text x="28" y="70" class="label">CONTRIBUTIONS</text>
  <text x="28" y="101" class="value">697</text>
  <text x="28" y="120" class="small">public + private count</text>

      
  <text x="182" y="70" class="label">COMMITS</text>
  <text x="182" y="101" class="value">683</text>
  

      
  <text x="310" y="70" class="label">PULL REQUESTS</text>
  <text x="310" y="101" class="value">5</text>
  

      
  <text x="466" y="70" class="label">REPOSITORIES</text>
  <text x="466" y="101" class="value">40</text>
  <text x="466" y="120" class="small">2 stars · 0 forks</text>

    
</svg>

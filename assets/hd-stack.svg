<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="62" viewBox="0 0 620 62" role="img" aria-labelledby="title desc">
  <title id="title">STACK section</title>
  <desc id="desc">Self-generated GitHub profile graphic for Mohammad Alsallal.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d20" />
      <stop offset="100%" stop-color="#0b0712" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }
      .title { fill: #f5f3ff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #a89bbd; font-size: 11px; letter-spacing: 1px; }
      .value { fill: #f5f3ff; font-size: 25px; font-weight: 700; }
      .small { fill: #a89bbd; font-size: 10px; }
    </style>
  </defs>
  
    <line x1="0" y1="51" x2="620" y2="51" stroke="#352451" />
    <rect x="0" y="49" width="86" height="3" rx="1.5" fill="url(#accent)" />
    <text x="0" y="31" fill="#c084fc" font-size="11" letter-spacing="2">02</text>
    <text x="56" y="32" fill="#f5f3ff" font-size="18" font-weight="700" letter-spacing="3">STACK</text>
  
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="150" viewBox="0 0 620 150" role="img" aria-labelledby="title desc">
  <title id="title">Contribution streaks</title>
  <desc id="desc">Self-generated GitHub profile graphic for Mohammad Alsallal.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d20" />
      <stop offset="100%" stop-color="#0b0712" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }
      .title { fill: #f5f3ff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #a89bbd; font-size: 11px; letter-spacing: 1px; }
      .value { fill: #f5f3ff; font-size: 25px; font-weight: 700; }
      .small { fill: #a89bbd; font-size: 10px; }
    </style>
  </defs>
  
    
  <rect x="1" y="1" width="618" height="148" rx="16" fill="url(#panel)" stroke="#352451" />
  <rect x="20" y="0" width="96" height="2" rx="1" fill="url(#accent)" filter="url(#glow)" />

    <text x="28" y="48" class="title">CONTRIBUTION STREAKS</text>
    <text x="28" y="82" fill="#c084fc" font-size="13">READY FOR LIVE DATA</text>
    <text x="28" y="108" class="small">Run the Generate profile graphics workflow after pushing.</text>
    <circle cx="574" cy="48" r="11" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="16 8">
      <animateTransform attributeName="transform" type="rotate" from="0 574 48" to="360 574 48" dur="2.5s" repeatCount="indefinite" />
    </circle>
  
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="620" height="188" viewBox="0 0 620 188" role="img" aria-labelledby="title desc">
  <title id="title">Mohammad Alsallal contribution streaks</title>
  <desc id="desc">Self-generated GitHub profile graphic for Mohammad Alsallal.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#130d20" />
      <stop offset="100%" stop-color="#0b0712" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      text {
        font-family: "JetBrains Mono", "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      }
      .title { fill: #f5f3ff; font-size: 18px; font-weight: 700; letter-spacing: 1px; }
      .label { fill: #a89bbd; font-size: 11px; letter-spacing: 1px; }
      .value { fill: #f5f3ff; font-size: 25px; font-weight: 700; }
      .small { fill: #a89bbd; font-size: 10px; }
    </style>
  </defs>
  
      
  <rect x="1" y="1" width="618" height="186" rx="16" fill="url(#panel)" stroke="#352451" />
  <rect x="20" y="0" width="96" height="2" rx="1" fill="url(#accent)" filter="url(#glow)" />

      <text x="26" y="36" class="title">CONSISTENCY</text>
      <text x="594" y="35" text-anchor="end" class="label">ROLLING 365 DAYS</text>
      
  <text x="28" y="72" class="label">CURRENT STREAK</text>
  <text x="28" y="103" class="value">1 days</text>
  

      
  <text x="226" y="72" class="label">LONGEST STREAK</text>
  <text x="226" y="103" class="value">17 days</text>
  

      
  <text x="432" y="72" class="label">ACTIVE DAYS</text>
  <text x="432" y="103" class="value">44%</text>
  

      
    <rect x="28" y="153" width="564" height="5" rx="2.5" fill="#241936" />
    <rect x="28" y="153" width="248.8" height="5" rx="2.5" fill="#a855f7" />
  
      <text x="28" y="173" class="small">161 days with at least one contribution</text>
    
</svg>
